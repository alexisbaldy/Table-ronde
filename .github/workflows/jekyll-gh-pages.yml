name: Deployer le site
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trouver le dossier du site
        run: |
          DIR=$(dirname "$(find . -name index.html -not -path './.git/*' | head -n 1)")
          echo "Dossier trouve : $DIR"
          mkdir -p /tmp/site
          rsync -a --exclude=.git --exclude=.github "$DIR"/ /tmp/site/
          mv /tmp/site ./_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
